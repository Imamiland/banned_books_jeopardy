---
# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
name: MegaLinter
# Trigger mega-linter at every push. Action will also be visible from
# Pull Requests to main
on:
    # Comment this line to trigger action only on pull-requests
    # (not recommended if you don't pay for GH Actions)
    push:
    pull_request:
        branches:
            - main
            - next
permissions: read-all
# Comment env block if you do not want to apply fixes
env:
    APPLY_FIXES: all
    APPLY_FIXES_EVENT: pull_request
    APPLY_FIXES_MODE: commit
concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}
    cancel-in-progress: true
jobs:
    megalinter:
        name: MegaLinter
        runs-on: ubuntu-latest
        # Give the default GITHUB_TOKEN write permission to commit and push, comment
        # issues, and post new Pull Requests; remove the ones you do not need
        permissions:
            contents: write
            issues: write
            pull-requests: write
            checks: write
        steps:
            # Git Checkout
            - name: Harden Runner
              uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
              with:
                  egress-policy: audit
            - name: Checkout Code
              uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
              with:
                  token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
                  # If you use VALIDATE_ALL_CODEBASE = true, you can remove this line to
                  # improve performance
                  fetch-depth: 0
            # MegaLinter
            - name: MegaLinter
              # You can override MegaLinter flavor used to have faster performances
              # More info at https://megalinter.io/latest/flavors/
              uses: oxsecurity/megalinter/flavors/javascript@e08c2b05e3dbc40af4c23f41172ef1e068a7d651 # v8.8.0
              id: ml
              env:
                  # Validates all source when push on main, else just the git diff with
                  # main. Override with true if you always want to lint all sources
                  #
                  # To validate the entire codebase, set to:
                  # VALIDATE_ALL_CODEBASE: true
                  #
                  # To validate only diff with main, set to:
                  # VALIDATE_ALL_CODEBASE: >-
                  #   ${{
                  #     github.event_name == 'push' &&
                  #     github.ref == 'refs/heads/main'
                  #   }}
                  VALIDATE_ALL_CODEBASE: true
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Uncomment to use ApiReporter (Grafana)
                  # API_REPORTER: true
                  # API_REPORTER_URL: ${{ secrets.API_REPORTER_URL }}
                  # API_REPORTER_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
                  # API_REPORTER_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}
                  # API_REPORTER_METRICS_URL: ${{ secrets.API_REPORTER_METRICS_URL }}
                  # API_REPORTER_METRICS_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_USERNAME }}
                  # API_REPORTER_METRICS_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_PASSWORD }}
                  # API_REPORTER_DEBUG: false
            # Upload MegaLinter artifacts
            - name: Archive production artifacts
              # ADD YOUR CUSTOM ENV VARIABLES HERE TO OVERRIDE VALUES OF
              # .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY

              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: success() || failure()
              with:
                  name: MegaLinter reports
                  path: |
                      megalinter-reports
                      mega-linter.log
            # Create pull request if applicable
            # (for now works only on PR from same repository, not from forks)
            - name: Import GPG key
              uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
                  fingerprint: ${{ secrets.GPG_SUBKEY_FINGERPRINT }}
                  trust_level: 5
                  git_user_signingkey: true
                  git_commit_gpgsign: true
                  git_tag_gpgsign: false
                  git_committer_name: ${{ vars.GIT_AUTHOR_NAME }}
                  git_committer_email: ${{ vars.GIT_AUTHOR_EMAIL }}
            - name: Test GPG Key Import
              run: gpg --list-keys --keyid-format LONG
            - name: Create Pull Request with applied fixes
              uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
              id: cpr
              if: >-
                  steps.ml.outputs.has_updated_sources == 1 && (

                    env.APPLY_FIXES_EVENT == 'all' ||
                    env.APPLY_FIXES_EVENT == github.event_name
                  ) && env.APPLY_FIXES_MODE == 'pull_request' && (

                    github.event_name == 'push' ||
                    github.event.pull_request.head.repo.full_name == github.repository
                  ) && !contains(github.event.head_commit.message, 'skip fix')
              with:
                  token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
                  commit-message: '[MegaLinter] Apply linters automatic fixes'
                  title: '[MegaLinter] Apply linters automatic fixes'
                  labels: bot
            - name: Create PR output
              if: >-
                  steps.ml.outputs.has_updated_sources == 1 && (

                    env.APPLY_FIXES_EVENT == 'all' ||
                    env.APPLY_FIXES_EVENT == github.event_name
                  ) && env.APPLY_FIXES_MODE == 'pull_request' && (

                    github.event_name == 'push' ||
                    github.event.pull_request.head.repo.full_name == github.repository
                  ) && !contains(github.event.head_commit.message, 'skip fix')
              run: |
                  echo "PR Number - ${{ steps.cpr.outputs.pull-request-number }}"
                  echo "PR URL - ${{ steps.cpr.outputs.pull-request-url }}"
            # Push new commit if applicable
            # (for now works only on PR from same repository, not from forks)
            - name: Prepare commit
              if: >-
                  steps.ml.outputs.has_updated_sources == 1 && (

                    env.APPLY_FIXES_EVENT == 'all' ||
                    env.APPLY_FIXES_EVENT == github.event_name
                  ) && env.APPLY_FIXES_MODE == 'commit' && github.ref != 'refs/heads/main' && (

                    github.event_name == 'push' ||
                    github.event.pull_request.head.repo.full_name == github.repository
                  ) && !contains(github.event.head_commit.message, 'skip fix')
              run: sudo chown -Rc $UID .git/
            - name: Commit and push applied linter fixes
              uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
              if: >-
                  steps.ml.outputs.has_updated_sources == 1 && (

                    env.APPLY_FIXES_EVENT == 'all' ||
                    env.APPLY_FIXES_EVENT == github.event_name
                  ) && env.APPLY_FIXES_MODE == 'commit' && github.ref != 'refs/heads/main' && (

                    github.event_name == 'push' ||
                    github.event.pull_request.head.repo.full_name == github.repository
                  ) && !contains(github.event.head_commit.message, 'skip fix')
              with:
                  branch: >-
                      ${{ github.event.pull_request.head.ref ||
                        github.head_ref ||
                        github.ref
                      }}
                  commit_message: '[MegaLinter] Apply linters fixes'
                  commit_user_name: imamiland-bot
                  commit_user_email: 152510784+imamiland-bot@users.noreply.github.com
