---
name: Vercel Preview Deployments
on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main
env:
    VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT_GITHUB }}
    BRANCH: ${{ github.ref_name }}
permissions:
    contents: read
jobs:
    build_and_test:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
              with:
                  egress-policy: audit
            - name: Checkout the Repository
              uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
              with:
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
            - name: Setup NodeJS
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version-file: 'package.json'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Ensure playwright has the latest browser binaries
              run: pnpx playwright install --with-deps
            - name: Ensure project is formatted and linted
              run: pnpm run lint
            - name: Ensure project syncs the configs
              run: pnpm run check
            - name: Build
              run: pnpm run build
            - name: Test
              run: pnpm run test
            - name: Setup GPG Keys
              uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
              with:
                  git_user_signingkey: true
                  git_commit_gpgsign: true
                  git_tag_gpgsign: true
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
                  git_committer_email: ${{ vars.GIT_AUTHOR_EMAIL }}
                  fingerprint: ${{ vars.GPG_FINGERPRINT }}
            - name: Create a release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  EDITOR: "echo 'Created-by: semantic-release' > $1"
              run: pnpm run release
    deploy_preview:
        runs-on: ubuntu-latest
        needs: build_and_test
        if: needs.build_and_test.result == 'success'
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
              with:
                  egress-policy: audit
            - name: Checkout the Repository
              uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
            - name: Decide Deployment Environment
              id: deployment_environment
              run: |
                  if [[ ${{ env.BRANCH }} == "main" ]]; then
                    echo "PROJECT_ENVIRONMENT=production" >> $GITHUB_ENV
                  else
                    echo echo "PROJECT_ENVIRONMENT=preview" >> $GITHUB_ENV
                  fi
            - name: Setup pnpm
              uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
            - name: Setup NodeJS
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version-file: 'package.json'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Install vercel CLI
              run: pnpm install -g vercel
            - name: Ensure project syncs the configs
              run: pnpm run check
            - name: Populate Preview Variables
              run: vercel pull --yes --environment=${{env.PROJECT_ENVIRONMENT}} --token=${{ env.VERCEL_TOKEN }}
            - name: Build Project
              run: vercel build --yes --token=${{ env.VERCEL_TOKEN }}
              env:
                  ENABLE_EXPERIMENTAL_COREPACK: 1
            - name: Deploy to Vercel
              run: vercel deploy --prebuilt --token=${{ env.VERCEL_TOKEN }}
