name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the application
title: '[BUG] '
labels: ['bug', 'needs triage']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report this bug! Please fill out the information below to help us understand and fix the issue.

    - type: textarea
      id: description
      attributes:
          label: Bug Description
          description: A clear and concise description of what the bug is.
          placeholder: Describe the bug in detail...
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to Reproduce
          description: Provide detailed steps to reproduce the issue.
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. Scroll down to '...'
              4. See error
          value: |
              1.
              2.
              3.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: What did you expect to happen?
          placeholder: Describe what should have happened...
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual Behavior
          description: What actually happened instead?
          placeholder: Describe what actually happened...
      validations:
          required: true

    - type: dropdown
      id: severity
      attributes:
          label: Severity
          description: How severe is this bug?
          options:
              - Critical (Application unusable/crashes)
              - High (Major functionality broken)
              - Medium (Feature partially broken)
              - Low (Minor issue/cosmetic)
      validations:
          required: true

    - type: dropdown
      id: browser
      attributes:
          label: Browser
          description: Which browser are you using?
          options:
              - Chrome
              - Firefox
              - Safari
              - Edge
              - Other
      validations:
          required: false

    - type: input
      id: browser-version
      attributes:
          label: Browser Version
          description: What version of the browser?
          placeholder: e.g. 120.0.6099.109
      validations:
          required: false

    - type: dropdown
      id: os
      attributes:
          label: Operating System
          description: What OS are you using?
          options:
              - macOS
              - Windows
              - Linux
              - iOS
              - Android
              - Other
      validations:
          required: false

    - type: input
      id: node-version
      attributes:
          label: Node.js Version (if applicable)
          description: For development/build issues, what Node.js version?
          placeholder: e.g. 22.20.0
      validations:
          required: false

    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots/Videos
          description: If applicable, add screenshots or videos to help explain the problem.
          placeholder: Drag and drop images or paste links here...
      validations:
          required: false

    - type: textarea
      id: logs
      attributes:
          label: Console Logs/Error Messages
          description: Include any relevant console logs, error messages, or stack traces.
          placeholder: Paste console output or error messages here...
          render: shell
      validations:
          required: false

    - type: textarea
      id: additional
      attributes:
          label: Additional Context
          description: Add any other context about the problem here.
          placeholder: Any other relevant information...
      validations:
          required: false

    - type: checkboxes
      id: checklist
      attributes:
          label: Pre-submission Checklist
          description: Please confirm the following before submitting
          options:
              - label: I have searched existing issues to ensure this bug hasn't been reported
                required: true
              - label: I have provided steps to reproduce the issue
                required: true
              - label: I have included relevant screenshots/logs if available
                required: false

    - type: markdown
      attributes:
          value: |
              ---

              ### 📋 For Maintainers

              When triaging this issue, please set:
              - **Type**: `fix`
              - **Priority**: P0 (Critical) / P1 (High) / P2 (Medium) / P3 (Low) / P4 (Nice to have)
              - **Size**: XS (< 1 day) / S (1-2 days) / M (3-5 days) / L (1-2 weeks) / XL (> 2 weeks)
              - **Feature Area**: Backend / Frontend / Testing / Documentation / Infrastructure / Auth & Security
              - **Milestone**: MVP / Alpha / Beta / Release Candidate / Release 1.0
